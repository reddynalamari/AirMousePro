name: Release

# Every push to main/master that changes app code builds a signed APK and publishes
# a GitHub Release with an auto-incremented version (v0.0.1, v0.0.2, ...).
# Run it manually from the Actions tab to bump minor/major instead.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      rollback_to:
        description: >
          Optional. An older tag (for example v0.0.3) to rebuild and publish as a NEW, higher version.
          Android refuses to install an older version over a newer one, so a rollback has to ship as a newer release.
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need all tags to compute the next version
          # Empty means the pushed commit; a tag means "rebuild that older source".
          ref: ${{ inputs.rollback_to || '' }}

      - name: Compute next version
        id: ver
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
          ROLLBACK: ${{ inputs.rollback_to || '' }}
        run: |
          if [ -n "$ROLLBACK" ] && ! git rev-parse -q --verify "refs/tags/$ROLLBACK" > /dev/null; then
            echo "::error::rollback_to '$ROLLBACK' is not an existing tag."
            exit 1
          fi
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next="0.0.1"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              *)     patch=$((patch+1)) ;;
            esac
            next="$major.$minor.$patch"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "previous=$last" >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous: ${last:-none})"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Decode signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "::warning::No KEYSTORE_BASE64 secret - signing with the debug key. Updates over a previous install will fail across runners."
          fi

      - name: Build release APK
        run: >
          gradle :app:assembleRelease --stacktrace
          -PversionName=${{ steps.ver.outputs.version }}
          -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/AirMousePro-v${{ steps.ver.outputs.version }}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK: ${{ inputs.rollback_to || '' }}
        run: |
          v="v${{ steps.ver.outputs.version }}"
          title="AirMouse Pro $v"
          notes="Install: download **AirMousePro-$v.apk** on your Android phone (Android 9+) and open it. Allow *install unknown apps* when prompted."
          if [ -n "$ROLLBACK" ]; then
            title="$title (rollback to $ROLLBACK)"
            notes="Rollback build: this is the source of **$ROLLBACK** published as a newer version so phones accept it as an update. $notes"
          fi
          # HEAD is the checked-out commit: the pushed one normally, or the old tag's commit for a rollback.
          gh release create "$v" dist/* \
            --target "$(git rev-parse HEAD)" \
            --title "$title" \
            --generate-notes \
            --notes "$notes"
